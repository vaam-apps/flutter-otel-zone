name: otel_zone
description: >-
  One Talker, one OpenTelemetry SDK and one guarded zone for a Flutter app.
  Every uncaught framework, async, platform and isolate error lands on the
  same sink, and a severity floor decides what is worth a metered radio.
version: 0.5.0 # x-release-please-version
publish_to: 'none'
repository: https://github.com/vaam-apps/flutter-otel-zone

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # The OpenTelemetry SDK. The 1.1 beta line is the *current* release —
  # 0.11.0 "stable" is an older one, not a newer, so these prereleases are
  # not a downgrade.
  dartastic_opentelemetry: ^1.1.0-beta.15
  # Semantic conventions: `App.appBuildId` for `app.build_id`.
  #
  # Capped below rc.4, on purpose. rc.4 (2026-10-08) removed members that
  # `dartastic_opentelemetry` beta.15 still calls (`APISpan.attributes`,
  # `spanEvents`, `status`, ...), so that pair does not compile. `^1.0.0-rc.3`
  # does not keep it out: pub resolves this package first, picks the newest
  # (rc.4), and then settles for beta.15 because beta.16, which carries the
  # same cap, is the one release that cannot sit beside rc.4. Every fresh
  # `pub get` — CI's, an app's, the example's — got the broken pair. Lift the
  # cap when `dartastic_opentelemetry` ships a release built on rc.4.
  dartastic_opentelemetry_api: '>=1.0.0-rc.3 <1.0.0-rc.4'
  # `Int64`, which the SDK's public log-record API takes and returns for
  # timestamps but does not re-export. Already in the graph via the SDK, so
  # this adds no package an install did not already have.
  fixnum: ^1.1.1
  # Mirrors a Talker record into the OTel logs pipeline. `OtelBridge` is the
  # thing in front of it that decides which records get that far.
  otel_talker: ^0.1.0
  # `OTelGoRouterObserver` — a plain `NavigatorObserver`, which is why
  # `OtelZone.routeObserver()` works with any router. See the README's note
  # on this package's spurious `go_router: ^17.0.0` bound.
  otel_go_router: ^0.2.0
  # `OTelRiverpodObserver` — a `ProviderObserver`.
  otel_riverpod: ^0.2.0
  # For the `ProviderObserver` type alone. The core package, not
  # flutter_riverpod or hooks_riverpod: an app on either of those already
  # has this, and an app on neither is not asked to take them.
  riverpod: ^3.0.0
  # The log sink itself. Not `talker_flutter`: nothing here renders, and an
  # app that wants `TalkerScreen` adds it for its own reasons.
  talker: ^5.1.20
  # `RiverpodFailLog`, whose error and stack trace live in fields `TalkerData`
  # does not have, so the bridge has to know the type to scrub and keep them.
  # It adds nothing to the graph: its own dependencies are `talker`, `riverpod`
  # and `meta`, all already here.
  talker_riverpod_logger: ^5.1.20

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Generates `NativeCrashApi` — the Dart client, the Kotlin interface and the
  # Swift protocol — from `pigeons/native_crash.dart`. A dev dependency: the
  # generated output is committed, so building the app does not need it.
  pigeon: ^29.0.4

flutter:
  # The crash-capture channel needs native code on both platforms, which makes
  # this a plugin rather than a plain package. Android and iOS only: web has no
  # process to have died, and desktop is not a target.
  plugin:
    platforms:
      android:
        package: com.vaam.otel_zone
        pluginClass: OtelZonePlugin
      ios:
        pluginClass: OtelZonePlugin
