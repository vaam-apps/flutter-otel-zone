# Proves native crash capture on a real Android runtime.
#
# The Kotlin unit tests in `ci.yml` check the pieces; this checks that a process
# which really dies — an uncaught exception, a SIGSEGV, an ANR — is drained
# exactly once on the next launch and not again after that. It exists because
# that behaviour is the OS's, not ours: `ApplicationExitInfo`, tombstones and
# the ANR path change between Android releases, and only a device notices.
#
# Flutter's `integration_test` cannot run this, because the test runner is the
# process that dies. `tool/android-crash-harness.dart` drives the device from
# the host instead (see its header, and the README's "Crash harness" section).
#
# API 30 and API 34, because they differ where it matters: API 30 has
# `ApplicationExitInfo` but no tombstone stream (that arrives in 31); API 34 has
# both.
#
# It runs on every pull request. If it proves too slow or too flaky for that,
# the `pull_request` trigger is the thing to drop: the nightly schedule and
# `workflow_dispatch` keep the coverage.
name: crash-harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: crash-harness-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same pin as ci.yml; see the note there.
  FLUTTER_VERSION: "3.48.0-0.4.pre"
  # The example is built to export here, and the harness listens on it. The
  # emulator reaches the runner's loopback through `adb reverse`.
  OTEL_PORT: "4421"
  # The Android emulator build the harness runs on: 37.2.12.0, stable since
  # 2026-10-01. On its own it stalled QEMU about twelve minutes into the API 34
  # run and took adb with it, on every run that reached the repeat stage; the
  # last build that passed without help is 37.1.11.0 (15917651). The step "Free
  # the host" below is what lets 37.2.12.0 through. Bump this only after the
  # harness has passed repeatedly on the new build; the first script line of
  # the emulator step fails it if the emulator installed is not this one.
  EMULATOR_BUILD: "16428233"

jobs:
  android:
    name: android crash harness (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: main
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Hardware acceleration for the emulator; without it x86_64 images are
      # unusably slow. This is the action's own documented recipe.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve
        run: flutter pub get

      - name: Resolve the example
        working-directory: example
        run: flutter pub get

      # The Gradle wrapper is generated, not committed; see ci.yml.
      - name: Generate the example's Gradle wrapper
        working-directory: example
        run: flutter create --platforms=android .

      # The build the crashed one is updated to, for the upgrade check below:
      # its own version and build, so a record recovered by it can be told to
      # name the older build that died. Built first because every build lands
      # at the same path; the default build after it is the one the rest use.
      - name: Build the upgrade target (debug, 1.0.1+2)
        working-directory: example
        run: |
          flutter build apk --debug --build-name 1.0.1 --build-number 2 \
            --dart-define=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:${{ env.OTEL_PORT }} \
            --dart-define=APP_VERSION=1.0.1 --dart-define=APP_BUILD=2
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/app-1.0.1-2.apk"

      # Built before the emulator starts, so the emulator is not idle through
      # a Gradle build.
      - name: Build the example (debug)
        working-directory: example
        run: flutter build apk --debug --dart-define=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:${{ env.OTEL_PORT }}

      - name: Build the example (release), for the refusal check
        working-directory: example
        run: flutter build apk --release --dart-define=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:${{ env.OTEL_PORT }}

      # The host's memory and disk every 15 seconds, for the emulator step
      # below, whose failures have looked like a host problem (QEMU stalls, adb
      # offline). It keeps running after this step and is stopped with the job.
      # Once the emulator is up it also records the emulator's own memory: the
      # rollup every time, and its five largest mappings once a minute, because
      # the emulator's resident size is what the host's memory is spent on.
      - name: Sample the host
        run: |
          mkdir -p "$GITHUB_WORKSPACE/harness-logs"
          (
            set +e
            n=0
            while true; do
              date -u +%FT%TZ
              free -m
              df -h "$HOME"
              ps -eo pid,rss,etimes,args --sort=-rss | head -n 6 | cut -c1-160
              pid=$(pgrep -f /qemu-system-x86_64 | head -n 1)
              if [ -n "$pid" ]; then
                echo "emulator $pid"
                grep -E '^(Rss|Pss_Anon|Pss_File|Pss_Shmem|Swap):' "/proc/$pid/smaps_rollup"
                if [ $((n % 4)) -eq 0 ]; then
                  echo "largest mappings (kB, range, name)"
                  awk '/^[0-9a-f]+-[0-9a-f]+ /{m=$1" "$6} /^Rss:/{print $2, m}' "/proc/$pid/smaps" | sort -rn | head -n 5
                fi
              fi
              n=$((n + 1))
              echo
              sleep 15
            done
          ) > "$GITHUB_WORKSPACE/harness-logs/host.txt" 2>&1 < /dev/null &

      # The builds above leave their daemons running: a Gradle daemon (3.2 GB
      # resident on the last run that was measured) and two Kotlin compile
      # daemons (0.85 and 0.80 GB), about 4.9 GB that nothing uses again,
      # beside an emulator that takes 2.5 GB on a 16 GB runner with 286 MB left
      # free. The emulator build that stalls QEMU does so under that pressure,
      # so the daemons are stopped before it starts. `free -m` before and after
      # is in the log, and the sampler above keeps the rest in host.txt.
      - name: Free the host
        working-directory: example/android
        run: |
          free -m
          ./gradlew --stop
          # `pkill` exits 1 when nothing matched, which is a fine answer here:
          # the Gradle stop may already have taken the Kotlin daemons with it.
          pkill -f org.jetbrains.kotlin.daemon.KotlinCompileDaemon || true
          sleep 5
          free -m
          ps -eo pid,rss,args --sort=-rss | head -n 6 | cut -c1-160

      # One emulator boot for everything: the host-driven crashes, the
      # release-build refusal, and last the in-app channel test — last because
      # `flutter test` rebuilds the debug APK without the endpoint define, and
      # the harness's `--no-build` runs must use the ones built above. Each line
      # runs as its own command, and the step fails on the first one that does.
      #
      # The emulator is pinned (`EMULATOR_BUILD`, above) because the action
      # installs the latest stable one otherwise, and a change of build moves
      # what this step proves. The first line fails the step if the installed
      # emulator is another build, and the second logs the system image's
      # revision, so a change in either is read from the log rather than
      # guessed. The first reads the SDK's own record of the build instead of
      # running `emulator -version`, which loads QEMU and fails on this runner
      # for want of libpulse; the build that boots is the one the emulator's
      # first log line names.
      #
      # No run is retried: a run that needs a retry is a defect (see #36, where
      # a retry hid a crash exported twice). Two lines exist to measure that
      # rather than hope: `native` twenty times over on API 34, and the
      # recovery launch relaunched by the OS at several delays. The delays are
      # spread over the seconds a slow runner takes to start the app, because
      # the window they probe moves with the machine.
      - name: Crash, relaunch, drain
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-build: ${{ env.EMULATOR_BUILD }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: |
            grep -Fx "Pkg.BuildId=$EMULATOR_BUILD" "$ANDROID_HOME/emulator/source.properties"
            grep Pkg.Revision "$ANDROID_HOME/system-images/android-$API_LEVEL/google_apis/x86_64/source.properties"
            dart run tool/android-crash-harness.dart --no-build --kinds jvm,native,anr --log-dir ${{ github.workspace }}/harness-logs/kinds --port ${{ env.OTEL_PORT }}
            dart run tool/android-crash-harness.dart --no-build --kinds jvm,native --upgrade-apk ${{ runner.temp }}/app-1.0.1-2.apk --log-dir ${{ github.workspace }}/harness-logs/upgrade --port ${{ env.OTEL_PORT }}
            if [ "${{ matrix.api-level }}" = "34" ]; then dart run tool/android-crash-harness.dart --no-build --kinds native --repeat 20 --log-dir ${{ github.workspace }}/harness-logs/repeat --port ${{ env.OTEL_PORT }}; fi
            dart run tool/android-crash-harness.dart --no-build --kinds native --relaunch-after 1000,2000,3000,4500,6000,8000 --log-dir ${{ github.workspace }}/harness-logs/relaunch --port ${{ env.OTEL_PORT }}
            dart run tool/android-crash-harness.dart --no-build --release-refusal --port ${{ env.OTEL_PORT }}
            cd example && flutter test integration_test -d emulator-5554

      # The host's own record of the run, kept whether it passed or not: a
      # green run's memory and kernel log are what a red one is read against.
      - name: Keep the host's kernel log
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/harness-logs"
          sudo dmesg -T 2>&1 | tee "$GITHUB_WORKSPACE/harness-logs/host-dmesg.txt" > /dev/null || true

      # What the runs saw: each run's whole logcat and the OS's exit records,
      # and the host's memory, disk and kernel log. A failing run also prints
      # the lines that decide it, but a flake is read here, after the fact, not
      # re-run. Kept on every run, for the reason above.
      - name: Keep the harness logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-logs-api-${{ matrix.api-level }}
          path: harness-logs
          if-no-files-found: ignore
          retention-days: 7
