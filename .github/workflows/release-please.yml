name: release-please

# Proposes the next release as a pull request, and cuts the tag when that
# pull request merges.
#
# This workflow never publishes anything itself — there is no `release.yml`
# in this repo, because `pubspec.yaml` carries `publish_to: 'none'` (see
# that file's own comment): this plugin is deliberately not on pub.dev, so
# there is nothing for a publish step to push. What this workflow buys is
# purely a changelog and a tagged, citable version for anyone pinning this
# package by git ref or reading its history.
#
# ---------------------------------------------------------------------------
# Why a GitHub App token and not GITHUB_TOKEN
# ---------------------------------------------------------------------------
# This is load-bearing, not hygiene. GitHub deliberately does not raise
# workflow events for anything done with the default `GITHUB_TOKEN`, to stop
# a workflow triggering itself. So with `GITHUB_TOKEN` the `vX.Y.Z` tag would
# still be created, but the release PR would get no CI run at all — the same
# "a check that cannot run before merge is not a check" gap this org's own
# release guide (vaam-apps/.github, docs/releasing.md) documents at length.
#
# The App needs, on this repository only: `contents: write` (branches, tags,
# releases) and `pull-requests: write`. Its id and private key are the
# organization secrets RELEASE_PLEASE_APP_CLIENT_ID (the App's **Client ID**,
# `Iv23li…`, not its numeric App ID — `app-id` is deprecated and the two are
# different values on the App's settings page) and
# RELEASE_PLEASE_APP_PRIVATE_KEY (visibility: all, so this repo already has
# both). If either is missing the token step fails outright rather than
# silently falling back to GITHUB_TOKEN — a fallback would produce exactly
# the silent "tag exists, nothing ran" gap above.
#
# ---------------------------------------------------------------------------
# Why `release-type: dart`, and why there is no lockfile-sync step
# ---------------------------------------------------------------------------
# Unlike vsms's Rust workspace (which is forced onto `release-type: simple`
# because `rust` hard-errors on a manifest with no `[package]` section),
# this repo's `pubspec.yaml` is a real, single-package manifest — exactly
# what the `dart` strategy is for. Verified against release-please's own
# source (`src/updaters/dart/pubspec-yaml.ts`) before choosing it: the
# updater is a targeted `^version: ...$` regex replace, the same
# line-based shape as `Generic`, NOT the reparse-and-reserialize
# `GenericYaml` that destroyed a `Chart.yaml` in a sibling repo (that trap
# is specific to a *bare string* in `extra-files`, which this config never
# uses). Choosing `dart` also means `pubspec.yaml` needs no
# `x-release-please-version` annotation at all — it is handled
# unconditionally by the strategy itself — and its updater additionally
# understands Dart's `version: X.Y.Z+build` build-number convention, which
# a generic annotated-line replace would silently drop if one were ever
# added. `ios/flutter_sign_keypair.podspec` and
# `macos/flutter_sign_keypair.podspec` still need `extra-files` entries
# (in object form — see release-please-config.json) since they carry their
# own `s.version` line and the `dart` strategy does not know about them.
#
# `pubspec.lock` is committed nowhere in this repo (`.gitignore`: "Libraries
# should not include pubspec.lock"), so unlike vsms there is no lockfile for
# this workflow to refresh after the version bump.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never cancel a run that may be mid-way through opening or updating the
# release PR. Keyed per ref, for the same reason vsms's own release.yml
# gives: under a global key, a routine push to main could cancel a still-
# pending release-please run for a different ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The App token below carries every write this workflow performs; the
# workflow's own GITHUB_TOKEN needs nothing beyond reading the checkout.
permissions:
  contents: read

jobs:
  release-please:
    name: propose the next release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id`. They are DIFFERENT
          # values on the App's settings page — `app-id` is the numeric
          # App ID, `client-id` is the `Iv23li…` Client ID — so the secret
          # is named for the one this input actually wants.
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # No `owner`/`repositories` input: per the action's own README,
          # omitting both scopes the token to only the current repository —
          # the narrowest repo scope available, not the App's whole
          # installation. Permissions are scoped down explicitly too
          # (zizmor's `github-app` audit, "dangerous use of GitHub App
          # tokens": by default this action issues a token carrying every
          # permission the App holds org-wide, not just what this workflow
          # uses) to exactly the two this job performs: opening/updating a
          # branch and PR.
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
