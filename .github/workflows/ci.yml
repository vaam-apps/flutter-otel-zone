# The Dart gate. Nothing in `vaam-apps/.github` runs Dart — `lint.yml` says so
# in its own header ("It does NOT lint Rust or JS/TS", and it never touches
# Dart either) — so analysis and tests are this repository's own job.
#
# Three things run, and each can genuinely fail:
#
#   * `flutter analyze` over the package AND the example, with
#     `public_member_api_docs` raised to an error in analysis_options.yaml.
#     An undocumented knob in a package whose every knob decides what a phone
#     puts on a metered radio is the defect this catches.
#   * `flutter test`, which is the whole export-floor and breadcrumb contract.
#     None of it needs a device, a collector or a live OTel SDK — that is what
#     `RecordingTalkerObserver` is for.
#   * `dart format --set-exit-if-changed`, because a formatter that only runs
#     on someone's laptop formats differently on the next one.
#
# A second job, `android`, covers the Kotlin, and a third, `ios`, the Swift;
# none of the above touches either. The org-wide `lint.yml` checks .kt style
# and never compiles it, so before this job a Kotlin file that did not build
# passed every gate in this repository. That is not hypothetical: the first run of
# `:otel_zone:testDebugUnitTest` failed outright, and then failed 7/11 on a
# path bug that would have stopped every crash report from ever being written.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the exact build, not to a channel. `channel: main` alone
  # installs whatever main's HEAD is that day, which turns an unrelated
  # upstream change into a red run here. This is the same pin
  # `vaam-apps/vaam-apps`'s own ci.yml carries, so a green run here means the
  # package analyses under the Dart the consuming app is actually built with
  # — the one place the two must agree.
  FLUTTER_VERSION: "3.48.0-0.4.pre"

jobs:
  dart:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: main
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve
        run: flutter pub get

      # The example resolves through a path dependency on the package, so this
      # is also the check that the public API the README shows still compiles.
      - name: Resolve the example
        working-directory: example
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # AGP 9 needs a JDK it can run on, and the runner's default is not a
      # version this repository chose.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Sets ANDROID_HOME and accepts the licences, so AGP can fetch the
      # platform and build-tools that compileSdk 36 asks for instead of
      # failing on a component the image happens not to carry.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: main
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The plugin is pulled into the example's Gradle build by the path
      # dependency, and this is what writes .flutter-plugins-dependencies,
      # which the Gradle settings read to find the module at all.
      - name: Resolve
        run: flutter pub get

      - name: Resolve the example
        working-directory: example
        run: flutter pub get

      # The wrapper is generated, not committed — Flutter's template ignores it
      # — and the first attempt to commit it turned Super-linter red: shellcheck
      # flags SC2006, SC2034 and SC2164 in Gradle's own gradlew, which is not
      # ours to edit. Regenerating it here keeps the generated script out of the
      # repository while still giving this job a ./gradlew to run.
      - name: Generate the example's Gradle wrapper
        working-directory: example
        run: flutter create --platforms=android .

      # Runs the module's own JVM tests, and compiles every .kt file on the
      # way. Nothing else in this repository compiles them.
      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :otel_zone:testDebugUnitTest --console=plain

  # The Swift counterpart of the Kotlin job above, and for the same reason:
  # the org-wide lint never compiles a .swift file, so before this job one that
  # did not build passed every gate here. Two things run, because two things
  # can break separately:
  #
  #   * `swift test` on the Foundation-only half (ios/otel_zone/Sources/
  #     otel_zone/Crash), which is where the MetricKit mapper, the merge rule
  #     and the stores live. Needs only Xcode, not Flutter.
  #   * A simulator build of the example, which compiles the half that links
  #     Flutter and MetricKit — the plugin, the Pigeon glue, the subscriber.
  #     The runner is generated, not committed, for the same reason the Gradle
  #     wrapper is not.
  ios:
    name: swift unit tests and ios build
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: main
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Swift unit tests
        working-directory: ios/otel_zone/CrashTests
        run: swift test

      - name: Resolve
        run: flutter pub get

      - name: Resolve the example
        working-directory: example
        run: flutter pub get

      - name: Generate the example's iOS runner
        working-directory: example
        run: flutter create --platforms=ios .

      # Compiles every .swift file in the plugin against the real Flutter and
      # MetricKit, which nothing else in this repository does.
      - name: Build the example for the simulator
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      # The example's crash harness must exist in a Debug build and not in a
      # Release one. It is guarded by `#if DEBUG`, and Flutter's Xcode template
      # does not define DEBUG for the Runner target — example/ios/Flutter/
      # Debug.xcconfig does. So this has to check both directions: a guard that
      # is false everywhere would pass the "absent from release" half by
      # accident, which is exactly how it went wrong the first time.
      - name: Crash harness is in Debug and absent from Release
        working-directory: example
        run: |
          markers="-e otel_zone_example/crash -e OtelZoneHarnessException"
          if ! grep -r -a -l $markers build/ios/iphonesimulator/Runner.app; then
            echo "the Debug build has no crash harness: DEBUG is not being defined" >&2
            exit 1
          fi
          flutter build ios --release --no-codesign
          if grep -r -a -l $markers build/ios/iphoneos/Runner.app/Runner; then
            echo "the Release build contains the crash harness" >&2
            exit 1
          fi
